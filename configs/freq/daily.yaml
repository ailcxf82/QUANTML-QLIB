freq_meta:
  name: "daily"
  freq_key: "1day"

# ?? base.yaml ? dataset.kwargs.segments
# valid ?? 2024 ?????????? + ??????????
#   ???????????????????? ICIR ?????????
# ?????????train ?? 6 ???valid ?? 6 ????
dataset_segments:
  train: ["2020-01-01", "2023-12-31"]
  valid: ["2024-01-01", "2024-12-31"]
  test:  ["2025-01-01", "2026-05-22"]

executor:
  class: "SimulatorExecutor"
  module_path: "qlib.backtest.executor"
  kwargs:
    time_per_step: "day"
    generate_portfolio_metrics: true

backtest:
  exchange_kwargs:
    freq: "day"
    # 涨跌停阈值 9.5%（A 股 ±10%，留 0.5% 缓冲避免触达停牌前）
    # ST 股日限幅 ±5%，但 universe=csi500 已剔除 ST，沿用 0.095
    limit_threshold: 0.095
    # ── W1 修正（2026-05-26）：deal_price 从 "close" 改为 "$close_qfq" ────
    # 与训练 label 中的 $close_qfq 字段对齐，且消除 qlib adjusted_price 模式下
    # "trade unit 100 not supported" 警告（lessons 2026-05-17 已发现，daily_prod 已修，
    # daily/daily_retrain/daily_5d_label 三个文件没改完，本次统一）。
    deal_price: "$close_qfq"
    # ── W1 修正（2026-05-26）：cost 中加入滑点估计 +10bp ────────────────
    # 旧值（0.0025 / 0.0035）只覆盖了"佣金 + 印花 + 过户"，未反映实盘滑点。
    # csi500 中小盘 + topk=8 单票实际滑点（5min VWAP vs 开盘价）约 0.10-0.15%，
    # 这里取保守 0.10%（双边各加），覆盖 90% 分位的滑点场景。
    #   买入 = 佣金 0.05% + 过户 0.10% + 滑点 0.10% = 0.25% → 0.35%
    #   卖出 = 佣金 0.05% + 印花 0.10% + 过户 0.10% + 滑点 0.10% = 0.35% → 0.45%
    # 历史依据：T1-ALL 实盘 vs 回测 sharpe gap ≈ 0.3，调成本是缩 gap 的最小风险动作。
    open_cost: 0.0035
    close_cost: 0.0045
    # 最低单边费 5 元
    min_cost: 5
    # 维持 impact_cost = 0：qlib 的冲击成本公式存在 $volume bug —— 公式
    #     adj_cost_ratio = impact_cost * (trade_val / total_trade_val)^2
    # 中 total_trade_val 在 qlib 内部以 `volume * price` 估算，对部分日期严重失真
    # （2025-01-02 实际成交额 1.38 万亿，qlib 估算 1.38 万元，差 9 个数量级）。
    # 启用后会导致 deal_amount=0、策略冻结。冲击成本已通过 open_cost/close_cost
    # 上调以近似反映；真实冲击成本控制走 daily_vol_target.yaml 的 max_weight。
    impact_cost: 0
