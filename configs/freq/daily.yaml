freq_meta:
  name: "daily"
  freq_key: "1day"

# ?? base.yaml ? dataset.kwargs.segments
# valid ?? 2024 ?????????? + ??????????
#   ???????????????????? ICIR ?????????
# ?????????train ?? 6 ???valid ?? 6 ????
dataset_segments:
  train: ["2020-01-01", "2023-12-31"]
  valid: ["2024-01-01", "2024-12-31"]
  # 仅扩展配置目标；已有回测产物覆盖范围须独立核对。
  test:  ["2025-01-01", "2026-10-15"]

executor:
  class: "SimulatorExecutor"
  module_path: "qlib.backtest.executor"
  kwargs:
    time_per_step: "day"
    generate_portfolio_metrics: true

backtest:
  # Tushare全字段库：pct_chg是百分数，change是元；仅在撮合报价内适配。
  # 成交与持仓估值统一使用close_qfq，不修改预测特征或共享行情文件。
  quote_contract: tushare_qfq_v1
  exchange_kwargs:
    freq: "day"
    # 涨跌停阈值 9.5%（A 股 ±10%，留 0.5% 缓冲避免触达停牌前）
    # ST 股日限幅 ±5%，但 universe=csi500 已剔除 ST，沿用 0.095
    limit_threshold: 0.095
    # ── W1 修正（2026-05-26）：deal_price 从 "close" 改为 "$close_qfq" ────
    # 与训练 label 中的 $close_qfq 字段对齐，且消除 qlib adjusted_price 模式下
    # "trade unit 100 not supported" 警告（lessons 2026-05-17 已发现，daily_prod 已修，
    # daily/daily_retrain/daily_5d_label 三个文件没改完，本次统一）。
    deal_price: "$close_qfq"
    impact_cost: 0
  # Commission is inclusive of regulatory fees; only commission has a minimum.
  # Tax reference: https://one.sse.com.cn/onething/gptz/ (checked 2026-10-29)
  fee_model:
    commission_rate: 0.00035
    minimum_commission: 5
    stamp_tax_sell_rate: 0.0005
    transfer_rate: 0.00001
    # User-selected 5bp per-side assumption (2026-10-29), reported separately.
    # Cash-equivalent deduction; not a measured price impact or broker charge.
    slippage_rate: 0.0005
